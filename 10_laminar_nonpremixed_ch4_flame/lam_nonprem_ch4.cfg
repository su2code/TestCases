%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file                                                       %
% Case description: Laminar counterflow diffusion flame of Smooke              %
% Strain rate: 54.67 1/s  
% Author: Nijso Beishuizen                                                     %
% Institution: TU Eindhoven                                                    %
