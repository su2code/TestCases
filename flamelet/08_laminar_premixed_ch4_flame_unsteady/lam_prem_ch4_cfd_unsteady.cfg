%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file                                                       %
% Case description: Laminar premixed CH4-Air at phi=0.75 in a channel          %
% Author: Tahsin Berk Kiymaz                                                   %
% Institution: Eindhoven University of Technology                              %
% Date: 24/04/2026                                                             %
% File Version 8.3.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER = INC_NAVIER_STOKES
KIND_TURB_MODEL= NONE
MATH_PROBLEM= DIRECT
RESTART_SOL = YES
%
% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
INC_DENSITY_MODEL= FLAMELET
INC_ENERGY_EQUATION = YES
INC_DENSITY_INIT= 1.00
INC_VELOCITY_INIT= (0.21, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 300.0
INC_NONDIM= DIMENSIONAL
%
% -------------------- FLUID MODEL --------------------------------------- %
%
FLUID_MODEL= FLUID_FLAMELET
FILENAMES_INTERPOLATOR= (fgm_ch4_phi075.drg)
CONTROLLING_VARIABLE_NAMES= (ProgressVariable, EnthalpyTot)
CONTROLLING_VARIABLE_SOURCE_NAMES = (ProdRateTot_PV, NULL)
%
% -------------------- SCALAR TRANSPORT ---------------------------------------%
%
KIND_SCALAR_MODEL= FLAMELET      
DIFFUSIVITY_MODEL= FLAMELET
VISCOSITY_MODEL= FLAMELET
CONDUCTIVITY_MODEL= FLAMELET
FLAME_INIT_METHOD= NONE 
%
% # progvar, enthalpy
%SPECIES_INIT = (0.0, -210000, 0.0, 0.0)
SPECIES_INIT = (0.0, -210000)
CONV_NUM_METHOD_SPECIES= BOUNDED_SCALAR
MUSCL_SPECIES= NO
SLOPE_LIMITER_SPECIES= NONE
TIME_DISCRE_SPECIES= EULER_IMPLICIT
%
% SCALAR CLIPPING
SPECIES_CLIPPING= YES
%SPECIES_CLIPPING_MIN= 0 -2e6 0 0
%SPECIES_CLIPPING_MAX= 1 2e6 1 1
SPECIES_CLIPPING_MIN= 0 -2e6
SPECIES_CLIPPING_MAX= 1 2e6
%
MARKER_INLET_SPECIES = (inlet, 0, -193600)
CFL_REDUCTION_SPECIES= 1.0
MARKER_SPECIES_STRONG_BC= (inlet, outlet)
LOOKUP_NAMES = (MolarWeightMix, Conductivity, Cp, HeatRelease, Diffusivity)
%USER_SCALAR_NAMES= (CO, NOx)
%USER_SOURCE_NAMES = ( ProdRatePos_Y-CO,  ProdRateNegScaled_Y-CO  , ProdRateTot_Y-NOx, NULL)
%
% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_SYM= (symmetry_bottom)
MARKER_EULER=wall
INC_INLET_TYPE= VELOCITY_INLET
% Inlet speed reduced to initiate flame traveling to upstream
MARKER_INLET = (inlet, 300.0, 0.1, 1.0, 0.0, 0.0)
INC_OUTLET_TYPE= PRESSURE_OUTLET
INC_INLET_DAMPING = 0.01
INC_OUTLET_DAMPING = 0.01
MARKER_OUTLET= (outlet, 0.0)
MARKER_PLOTTING= ( inlet )
MARKER_MONITORING= ( inlet )
MARKER_ANALYZE= ( inlet,outlet )
MARKER_ANALYZE_AVERAGE = AREA
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 200
CFL_ADAPT= NO
%ITER= 3000
OUTPUT_WRT_FREQ= 10
%
% ------------------------- UNSTEADY SIMULATION -------------------------------%
%
TIME_DOMAIN = YES
%
%TIME_MARCHING= TIME_STEPPING
TIME_MARCHING= DUAL_TIME_STEPPING-1ST_ORDER
%TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
%
RESTART_ITER=1
TIME_ITER=200
TIME_STEP= 5e-5
% time = 0.1 s
MAX_TIME=0.1
%
UNST_CFL_NUMBER= 0.0
INNER_ITER= 2000
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-4
LINEAR_SOLVER_ITER= 60
%
% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 0
%
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW = NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -11
CONV_FIELD= RMS_ProgressVariable, RMS_VELOCITY-X
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6
SCREEN_OUTPUT = INNER_ITER RMS_VELOCITY-X RMS_VELOCITY-Y RMS_PRESSURE RMS_ProgressVariable RMS_EnthalpyTot RMS_CO RMS_NOx LINSOL_ITER, LINSOL_RESIDUAL
HISTORY_OUTPUT = RMS_RES AERO_COEFF FLOW_COEFF FLOW_COEFF_SURF
VOLUME_OUTPUT = SOLUTION PRIMITIVE SOURCE RESIDUAL SENSITIVITY LOOKUP TIMESTEP
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FORMAT= SU2
MESH_FILENAME = 1d_chamber.su2 
MESH_OUT_FILENAME= mesh_out
SOLUTION_FILENAME= solution
RESTART_FILENAME= restart
OUTPUT_FILES = (RESTART,PARAVIEW,PARAVIEW_MULTIBLOCK) 
%OUTPUT_FILES = (RESTART) 
TABULAR_FORMAT = CSV
CONV_FILENAME= history
VOLUME_FILENAME= ch4_flame_cfd
SURFACE_FILENAME= surface_flow
WRT_PERFORMANCE = NO 
SCREEN_WRT_FREQ_INNER = 1
SCREEN_WRT_FREQ_OUTER = 1
