%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file                                                       %
% Case description: Laminar counterflow diffusion flame, from C.K. Law's book  %
% Strain rate: 56 1/s                                                          %
% Author: Nijso Beishuizen                                                     %
% Institution: TU Eindhoven                                                    %
% Date: 01/05/2026                                                             %
% File Version 8.4.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER = INC_NAVIER_STOKES
KIND_TURB_MODEL= NONE
RESTART_SOL = NO
%
% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
INC_DENSITY_MODEL= VARIABLE
INC_ENERGY_EQUATION = NO
INC_DENSITY_INIT= 1.00
INC_VELOCITY_INIT= (0.0, 0.5, 0.0 )
INC_TEMPERATURE_INIT= 300.0
INC_NONDIM= DIMENSIONAL
%
% -------------------- FLUID MODEL --------------------------------------- %
%
FLUID_MODEL= FLUID_FLAMELET
FILENAMES_INTERPOLATOR= ../fgm_ch4_ZH.drg
CONTROLLING_VARIABLE_NAMES= (MixtureFraction, EnthalpyTot)
CONTROLLING_VARIABLE_SOURCE_NAMES = (NULL, NULL)
%
% -------------------- SCALAR TRANSPORT ---------------------------------------%
%
KIND_SCALAR_MODEL= FLAMELET
DIFFUSIVITY_MODEL= FLAMELET
VISCOSITY_MODEL= FLAMELET
CONDUCTIVITY_MODEL= FLAMELET

FLAME_INIT_METHOD= FLAME_FRONT
% make sure to put it to NONE when restarting
%FLAME_INIT_METHOD= NONE
FLAME_INIT= (-0.006, 0.00, 0.00, 1.0, 0.0, 0.0, 1.0e-4, 1.0)
% # mixture fraction, enthalpy
SPECIES_INIT = (0.0, 1.9e3)
CONV_NUM_METHOD_SPECIES= BOUNDED_SCALAR
MUSCL_SPECIES= YES
SLOPE_LIMITER_SPECIES= NONE
TIME_DISCRE_SPECIES= EULER_IMPLICIT
% SCALAR CLIPPING
SPECIES_CLIPPING= YES
SPECIES_CLIPPING_MIN= 0 -1e6
SPECIES_CLIPPING_MAX= 1 +1e6
%
MARKER_INLET_SPECIES = (inlet_fuel, 1.0, -1e6, inlet_oxidizer, 0.0, 1.9e3)

%FLAMELET_ENTHALPY_BC= FLOW_MARKERS
%MARKER_WALL_SPECIES= (wall_fuel, FLUX, 0.0, VALUE, -4.645e6, wall_oxidizer, FLUX, 0.0, VALUE, 1.80e3)    % Z: zero-flux, H: Dirichlet


CFL_REDUCTION_SPECIES= 1
MARKER_SPECIES_STRONG_BC= (inlet_fuel,inlet_oxidizer, outlet, wall_fuel,wall_oxidizer)
LOOKUP_NAMES = (MolarWeightMix, Conductivity, Cp, Heat_Release, DiffusionCoefficient, X-CO, X-CO2, X-H2O, X-CH4, X-O2)
%
% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
AXISYMMETRIC= YES
FLAMELET_ENTHALPY_BC= FLOW_MARKERS
%
MARKER_HEATFLUX= (wall_fuel, 0.0, wall_oxidizer, 0.0, wall_outlet, 0.0)
MARKER_SYM= (symmetry)
%
INC_INLET_TYPE= VELOCITY_INLET, VELOCITY_INLET
INLET_USE_NORMAL= YES
MARKER_INLET = (inlet_fuel, 305., 0.45, 0.0, 1.0, 0.0, inlet_oxidizer, 305., 0.45, 0.0,-1.0, 0.0)
%
INC_OUTLET_TYPE= PRESSURE_OUTLET
%
INC_INLET_DAMPING = 0.1
INC_OUTLET_DAMPING = 0.1
%
MARKER_OUTLET= (outlet, 0)
MARKER_PLOTTING= ( wall_fuel )
MARKER_MONITORING= ( wall_fuel )
MARKER_ANALYZE= ( inlet_fuel,outlet )
MARKER_ANALYZE_AVERAGE = AREA
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 100

CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.95, 1.05, 1.0, 2000, 1.0e-3, 100)

ITER=1000
OUTPUT_WRT_FREQ= 100
%
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-03
LINEAR_SOLVER_ITER= 10
%
% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 0
%
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW = NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -12
CONV_FIELD = RMS_PRESSURE
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6
SCREEN_OUTPUT = INNER_ITER RMS_VELOCITY-X RMS_VELOCITY-Y RMS_PRESSURE RMS_MixtureFraction RMS_EnthalpyTot, AVG_CFL, LINSOL_ITER, LINSOL_RESIDUAL
HISTORY_OUTPUT = RMS_RES AERO_COEFF FLOW_COEFF FLOW_COEFF_SURF HEAT_SURF TOTAL_HEATFLUX TOTAL_HEATFLUX_ON_SURFACE
VOLUME_OUTPUT = SOLUTION PRIMITIVE SOURCE RESIDUAL SENSITIVITY LOOKUP TIMESTEP SPECIES
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FORMAT= SU2
MESH_FILENAME = counterflow.su2
%MESH_FILENAME = counterflow.su2
MESH_OUT_FILENAME= mesh_out
SOLUTION_FILENAME= solution
RESTART_FILENAME= restart
OUTPUT_FILES = (RESTART,PARAVIEW,PARAVIEW_MULTIBLOCK)
%OUTPUT_FILES = (RESTART)
TABULAR_FORMAT = CSV
CONV_FILENAME= history
VOLUME_FILENAME= ch4_flame_cfd
SURFACE_FILENAME= surface_flow
WRT_PERFORMANCE = YES
SCREEN_WRT_FREQ_INNER = 1
SCREEN_WRT_FREQ_OUTER = 1

DV_KIND= ROTATE_GRID
DV_PARAM= 0,0,0, 0, 0, 1
DV_VALUE= 90.0
